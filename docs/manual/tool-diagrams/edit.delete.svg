<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="520" viewBox="0 0 1260 520"><title>線と、それを使う面を確認して消すの操作と役割</title><rect width="1260" height="520" fill="#f4f8fb"/><g font-family="Yu Gothic UI,Meiryo,sans-serif" fill="#203043"><text x="30" y="42" font-size="25">線と、それを使う面を確認して消す</text><rect x="15" y="65" width="365" height="400" rx="12" fill="white" stroke="#9bb5c6"/><rect x="405" y="65" width="365" height="400" rx="12" fill="white" stroke="#9bb5c6"/><rect x="805" y="65" width="440" height="400" rx="12" fill="white" stroke="#9bb5c6"/><text x="30" y="91" font-size="18" fill="#086992">① 用意するもの</text><text x="30" y="125" font-size="19">20×10mm矩形から面を作る</text><image href="data:image/png;base64," x="425" y="96" width="58" height="58"/><text x="500" y="125" font-size="20">② 条件・操作</text><text x="420" y="190" font-size="19">原点の基準面は削除できない</text><text x="830" y="91" font-size="18" fill="#086992">③ 結果の見分け方</text><text x="830" y="125" font-size="19">確認した依存先も含めて削除する。Ctrl</text><text x="830" y="152" font-size="19">+Zで一括復元できる。</text><path d="M380 255h25m-10-8 10 8-10 8M770 255h35m-10-8 10 8-10 8" fill="none" stroke="#086992" stroke-width="3"/><text x="25" y="497" font-size="17">操作の意味を整理した模式図。画面写真や実際に生成した形状・精度の証拠ではありません。</text></g></svg>